<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Algadri MyQuran</title>
    <!-- Tailwind CSS & Google Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col justify-between pb-10">

    <!-- HEADER APLIKASI (Ketuk 3 kali judul untuk buka panel admin rahasia) -->
    <div class="bg-white shadow-sm p-4 sticky top-0 z-30">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div onclick="cekAdminRahasia()" class="cursor-pointer select-none">
                <h1 id="app-title" class="text-xl font-bold text-emerald-600">Algadri MyQuran</h1>
                <p class="text-xs text-slate-400">Aplikasi Baca Al-Qur'an & Donasi</p>
            </div>
            <!-- Tombol alternatif buka admin yang tersembunyi/kecil -->
            <button onclick="bukaAdmin()" class="text-[10px] text-slate-300 hover:text-slate-500 p-2">
                ⚙️
            </button>
        </div>
    </div>

    <!-- KONTEN UTAMA -->
    <main class="max-w-md mx-auto w-full p-4 flex-1 space-y-4">
        
        <!-- Kotak Rekening / Donasi (Tombol aman tidak terhalang) -->
        <div class="bg-emerald-50 border border-emerald-200 rounded-2xl p-4 shadow-sm relative z-10">
            <h2 class="text-xs font-semibold text-emerald-800 uppercase tracking-wider mb-1">Rekening Donasi Resmi</h2>
            <p id="app-rekening" class="text-base font-mono font-bold text-slate-800 select-all">6285117316040</p>
            
            <a id="app-sosmed" href="https://whatsapp.com" target="_blank" class="mt-3 block text-center bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium py-2.5 rounded-xl transition shadow cursor-pointer relative z-20">
                Kunjungi Saluran / Media Sosial
            </a>
        </div>

        <!-- Daftar Dukungan / Donatur -->
        <div class="bg-white rounded-2xl shadow-sm p-4 border border-slate-100">
            <h2 class="text-sm font-bold text-slate-700 mb-2">Daftar Dukungan</h2>
            <div id="app-dukungan" class="text-xs text-slate-600 space-y-1 bg-slate-50 p-3 rounded-xl border border-slate-100">
                <p>1. Rafa</p>
            </div>
        </div>

        <!-- Daftar Surat Al-Qur'an (Bisa diklik tiap suratnya) -->
        <div class="bg-white rounded-2xl shadow-sm p-4 border border-slate-100">
            <h2 class="text-sm font-bold text-slate-700 mb-3">Daftar Surat Al-Qur'an</h2>
            <div id="daftar-surat" class="space-y-2">
                <p class="text-xs text-slate-400 text-center py-4">Memuat daftar surat...</p>
            </div>
        </div>
    </main>

    <!-- MODAL PANEL ADMIN TERSEMBUNYI -->
    <div id="admin-modal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl space-y-3">
            <h2 class="text-lg font-bold text-slate-800">Panel Admin Terpusat</h2>
            
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Username</label>
                <input type="text" id="input-user" placeholder="Masukkan username" class="w-full px-3 py-2 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-emerald-500">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Password</label>
                <input type="password" id="input-pass" placeholder="Masukkan password" class="w-full px-3 py-2 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-emerald-500">
            </div>

            <div id="form-pengaturan" class="hidden space-y-3 pt-2 border-t border-slate-100">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Nama Aplikasi</label>
                    <input type="text" id="input-title" class="w-full px-3 py-2 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Nomor Rekening</label>
                    <input type="text" id="input-rekening" class="w-full px-3 py-2 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Link Media Sosial</label>
                    <input type="text" id="input-sosmed" class="w-full px-3 py-2 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Daftar Dukungan (Gunakan garis baru / enter)</label>
                    <textarea id="input-dukungan" rows="3" class="w-full px-3 py-2 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-emerald-500"></textarea>
                </div>
            </div>

            <div class="flex space-x-2 pt-2">
                <button onclick="tutupAdmin()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 py-2.5 rounded-xl font-medium text-sm transition">
                    Batal
                </button>
                <button id="btn-aksi-admin" onclick="prosesLoginAdmin()" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white py-2.5 rounded-xl font-medium text-sm transition shadow">
                    Login Admin
                </button>
            </div>
        </div>
    </div>

    <!-- SCRIPT UTAMA & FIREBASE -->
    <script>
        // Inisialisasi Firebase Realtime Database kamu
        const firebaseConfig = {
            databaseURL: "https://algadrimyquran-default-rtdb.asia-southeast1.firebasedatabase.app/"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // 1. Ambil Data Real-time dari Firebase
        db.ref('pengaturan').on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                document.getElementById('app-title').innerText = data.title || "Algadri MyQuran";
                document.getElementById('app-rekening').innerText = data.rekening || "6285117316040";
                document.getElementById('app-sosmed').href = data.sosmed || "#";
                if(data.dukungan) {
                    // Format teks dukungan dengan mempertahankan baris baru
                    let formatDukungan = data.dukungan.split('\n').map(item => `<p>${item}</p>`).join('');
                    document.getElementById('app-dukungan').innerHTML = formatDukungan;
                }
            }
        });

        // 2. Ambil Daftar Surat Al-Qur'an dari API Publik
        fetch('https://equran.id/api/v2/surat')
            .then(response => response.json())
            .then(result => {
                const container = document.getElementById('daftar-surat');
                container.innerHTML = ''; 
                
                result.data.forEach(surat => {
                    const item = document.createElement('div');
                    item.className = "flex justify-between items-center p-3 hover:bg-emerald-50 rounded-xl transition border-b border-slate-50 cursor-pointer relative z-20";
                    item.innerHTML = `
                        <div class="flex items-center space-x-3">
                            <span class="w-8 h-8 rounded-full bg-emerald-100 text-emerald-700 flex items-center justify-center text-xs font-bold">${surat.nomor}</span>
                            <div>
                                <h3 class="text-sm font-bold text-slate-800">${surat.namaLatin}</h3>
                                <p class="text-xs text-slate-400">${surat.arti} (${surat.jumlahAyat} Ayat)</p>
                            </div>
                        </div>
                        <span class="text-lg font-serif text-emerald-600 font-bold">${surat.nama}</span>
                    `;
                    // Aksi ketika surat diklik (bisa dikustomisasi nanti)
                    item.onclick = () => {
                        alert("Membuka Surat: " + surat.namaLatin);
                    };
                    container.appendChild(item);
                });
            })
            .catch(() => {
                document.getElementById('daftar-surat').innerHTML = '<p class="text-xs text-red-500 text-center">Gagal memuat daftar surat. Periksa koneksi internet.</p>';
            });

        // 3. Logika Ketuk 3 Kali untuk Keamanan Panel Admin
        let ketukanCount = 0;
        function cekAdminRahasia() {
            ketukanCount++;
            setTimeout(() => { ketukanCount = 0; }, 1000); // Reset dalam 1 detik
            if (ketukanCount >= 3) {
                bukaAdmin();
                ketukanCount = 0;
            }
        }

        let isAdminLoggedIn = false;

        function bukaAdmin() {
            document.getElementById('admin-modal').classList.remove('hidden');
            if (!isAdminLoggedIn) {
                document.getElementById('form-pengaturan').classList.add('hidden');
                document.getElementById('btn-aksi-admin').innerText = "Login Admin";
            }
        }

        function tutupAdmin() {
            document.getElementById('admin-modal').classList.add('hidden');
        }

        function prosesLoginAdmin() {
            if (!isAdminLoggedIn) {
                let user = document.getElementById('input-user').value;
                let pass = document.getElementById('input-pass').value;

                if (user === "algadri" && pass === "hakim201230") {
                    isAdminLoggedIn = true;
                    alert("Login Admin Berhasil!");
                    document.getElementById('form-pengaturan').classList.remove('hidden');
                    document.getElementById('btn-aksi-admin').innerText = "Simpan Perubahan";
                    
                    // Masukkan data saat ini ke dalam form input
                    document.getElementById('input-title').value = document.getElementById('app-title').innerText;
                    document.getElementById('input-rekening').value = document.getElementById('app-rekening').innerText;
                    document.getElementById('input-sosmed').value = document.getElementById('app-sosmed').href;
                    document.getElementById('input-dukungan').value = document.getElementById('app-dukungan').innerText;
                } else {
                    alert("Username atau Password salah!");
                }
            } else {
                // Proses Simpan ke Firebase
                const newTitle = document.getElementById('input-title').value;
                const newRekening = document.getElementById('input-rekening').value;
                const newSosmed = document.getElementById('input-sosmed').value;
                const newDukungan = document.getElementById('input-dukungan').value;

                db.ref('pengaturan').set({
                    title: newTitle,
                    rekening: newRekening,
                    sosmed: newSosmed,
                    dukungan: newDukungan
                }, (error) => {
                    if (error) {
                        alert("Gagal menyimpan data!");
                    } else {
                        alert("Berhasil disimpan secara online!");
                        tutupAdmin();
                    }
                });
            }
        }
    </script>
</body>
</html>
